services:
  claude-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claude-sandbox
    restart: unless-stopped

    # SSH password is read from .env (never commit that file)
    environment:
      - SSH_PASSWORD=${SSH_PASSWORD}
      # Optional: pre-set your Anthropic API key so Claude Code works immediately
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

    ports:
      # Host port 1122 → container SSH port 22
      - "1122:22"

    volumes:
      # Persistent workspace: your projects live here and survive container restarts
      - claude-workspace:/workspace

    # Reasonable resource guardrails — adjust to taste
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

    # Drop all Linux capabilities and only add back what SSH needs
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE

    # Prevent the container from gaining new privileges
    security_opt:
      - no-new-privileges:false   # must be false so sshd can setuid; see note below

volumes:
  claude-workspace:
    driver: local
