services:
  claude-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claude-sandbox
    restart: unless-stopped

    environment:
      # Optional: pre-set your Anthropic API key so Claude Code works immediately
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

    ports:
      # Host port 1122 → container SSH port 22
      - "1122:22"

    volumes:
      # Bind mount: host ./workspace ↔ container /workspace
      # Create the folder first: mkdir -p workspace
      - ./workspace:/workspace
      - ./home_dot_claude:/home/claude/.claude

    secrets:
      - authorized_keys

    security_opt:
      - no-new-privileges:false   # must be false so sshd can setuid

    networks:
      - elliot_default

networks:
  elliot_default:
    external: true

secrets:
  authorized_keys:
    # Path to your public key file on the host.
    # Generate one with: ssh-keygen -t ed25519 -f ~/.ssh/claude_sandbox
    # Then set the path below (or in .env as AUTHORIZED_KEYS_FILE)
    file: ./id_rsa.pub
